plugins {
    id 'com.android.application'
}

android {
    namespace 'com.svoyaigra.kids'
    compileSdk 35

    defaultConfig {
        applicationId "com.svoyaigra.kids"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

// Kotlin 1.8+ включил kotlin-stdlib-jdk7 и kotlin-stdlib-jdk8 в kotlin-stdlib.
// Разные версии этих модулей дают "Duplicate class" на checkDebugDuplicateClasses.
// Приводим все три к одной версии: jdk7/jdk8 становятся пустыми заглушками.
configurations.configureEach {
    resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    )
}
